<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cross Cut Camera</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* 카메라 화면 */
#camera{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

/* Grid 영역 */
#overlay{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:70vw;
    height:70vw;

    max-width:500px;
    max-height:500px;

    border:3px solid lime;

    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);

    z-index:10;

    pointer-events:none;
}

/* Grid 셀 */
.cell{
    border:1px solid rgba(0,255,0,0.7);
}

/* 제목 */
#title{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;

    color:white;
    font-size:24px;
    font-weight:bold;

    z-index:20;
}

/* 촬영 버튼 */
#captureBtn{

    position:absolute;

    bottom:40px;
    left:50%;

    transform:translateX(-50%);

    width:90px;
    height:90px;

    border-radius:50%;
    border:none;

    background:white;

    font-size:18px;
    font-weight:bold;

    z-index:20;

    cursor:pointer;
}

/* 가운데 십자선 */
#centerCross{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:30px;
    height:30px;

    z-index:15;
}

#centerCross::before{
    content:"";
    position:absolute;

    left:50%;
    top:0;

    width:2px;
    height:100%;

    background:red;
}

#centerCross::after{
    content:"";
    position:absolute;

    top:50%;
    left:0;

    width:100%;
    height:2px;

    background:red;
}

</style>
</head>

<body>

<div id="title">
Cross Cut Camera
</div>

<video
    id="camera"
    autoplay
    playsinline>
</video>

<div id="centerCross"></div>

<div id="overlay"></div>

<button id="captureBtn">
촬영
</button>

<script>

const overlay = document.getElementById("overlay");

/* 5×5 Grid 생성 */
for(let i=0;i<25;i++)
{
    const cell=document.createElement("div");
    cell.className="cell";
    overlay.appendChild(cell);
}

/* 카메라 시작 */
async function startCamera()
{
    try
    {
        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            }
        });

        document.getElementById("camera").srcObject=stream;
    }
    catch(err)
    {
        alert("카메라 접근 실패");
        console.error(err);
    }
}

startCamera();

/* 촬영 버튼 (현재는 테스트용) */

document.getElementById("captureBtn")
.addEventListener("click",()=>{

    alert("촬영 기능은 다음 단계에서 추가");

});

</script>

</body>
</html>
