<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CrossCut Camera</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* Camera */

#camera{
    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    object-fit:cover;

    background:black;

    z-index:1;
}

/* Title */

#title{

    position:fixed;

    top:15px;

    width:100%;

    text-align:center;

    color:white;

    font-size:24px;

    font-weight:bold;

    z-index:20;
}

/* Control Panel */

#panel{

    position:fixed;

    top:60px;

    left:50%;

    transform:translateX(-50%);

    z-index:20;

    background:rgba(0,0,0,0.6);

    padding:10px;

    border-radius:10px;

    color:white;

    display:flex;

    flex-direction:column;

    gap:8px;
}

#sampleId{

    width:180px;

    padding:6px;

    border:none;

    border-radius:5px;
}

#status{

    text-align:center;

    color:lime;

    font-weight:bold;
}

/* Grid */

#overlay{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:70vw;
    height:70vw;

    max-width:500px;
    max-height:500px;

    border:3px solid lime;

    display:grid;

    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);

    z-index:10;

    pointer-events:none;
}

.cell{

    border:1px solid rgba(0,255,0,0.7);
}

/* Crosshair */

#crosshair{

    position:fixed;

    top:50%;
    left:50%;

    width:40px;
    height:40px;

    transform:translate(-50%,-50%);

    z-index:15;
}

#crosshair::before{

    content:"";

    position:absolute;

    left:50%;

    width:2px;
    height:100%;

    background:red;
}

#crosshair::after{

    content:"";

    position:absolute;

    top:50%;

    width:100%;
    height:2px;

    background:red;
}

/* Capture Button */

#captureBtn{

    position:fixed;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);

    width:120px;
    height:120px;

    border:none;

    border-radius:50%;

    background:white;

    font-size:20px;

    font-weight:bold;

    z-index:20;
}

canvas{
    display:none;
}

</style>

</head>

<body>

<video
id="camera"
autoplay
playsinline
muted>
</video>

<div id="title">
CrossCut Camera
</div>

<div id="panel">

<label>Sample ID</label>

<input
type="text"
id="sampleId"
placeholder="CC001">

<label>Grid Opacity</label>

<input
type="range"
id="opacitySlider"
min="10"
max="100"
value="70">

<div id="status">
Starting...
</div>

</div>

<div id="crosshair"></div>

<div id="overlay"></div>

<button id="captureBtn">
Capture
</button>

<canvas id="canvas"></canvas>

<script>

/* Create Grid */

const overlay =
document.getElementById("overlay");

for(let i=0;i<25;i++)
{
    const cell =
    document.createElement("div");

    cell.className = "cell";

    overlay.appendChild(cell);
}

/* Grid Opacity */

document
.getElementById("opacitySlider")
.addEventListener("input",function(){

    overlay.style.opacity =
    this.value / 100;
});

/* Camera */

const video =
document.getElementById("camera");

async function startCamera()
{
    try
    {
        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false
        });

        video.srcObject = stream;

        await video.play();

        document
        .getElementById("status")
        .innerHTML =
        "Rear Camera Ready";
    }

    catch(error)
    {

        try
        {
            const fallback =
            await navigator.mediaDevices.getUserMedia({

                video:true,
                audio:false

            });

            video.srcObject =
            fallback;

            await video.play();

            document
            .getElementById("status")
            .innerHTML =
            "Camera Ready";
        }

        catch(secondError)
        {

            document
            .getElementById("status")
            .innerHTML =
            secondError.name;

            alert(
                "Camera Error : " +
                secondError.name
            );
        }
    }
}

startCamera();

/* Capture */

document
.getElementById("captureBtn")
.addEventListener("click",()=>{

    const sampleId =

    document
    .getElementById("sampleId")
    .value
    .trim()

    ||

    "Sample";

    const canvas =
    document
    .getElementById("canvas");

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const now =
    new Date();

    const fileName =

        sampleId +

        "_" +

        now.getFullYear() +

        ("0"+(now.getMonth()+1)).slice(-2) +

        ("0"+now.getDate()).slice(-2) +

        "_" +

        ("0"+now.getHours()).slice(-2) +

        ("0"+now.getMinutes()).slice(-2) +

        ("0"+now.getSeconds()).slice(-2)

        +

        ".png";

    const link =
    document.createElement("a");

    link.download =
    fileName;

    link.href =
    canvas.toDataURL("image/png");

    link.click();

    document
    .getElementById("status")
    .innerHTML =
    "Saved : " + fileName;
});

</script>

</body>
</html>
