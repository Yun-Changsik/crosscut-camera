<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrossCut Camera</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* Camera */

#camera{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Title */

#title{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:bold;
    z-index:30;
}

/* Controls */

#controls{

    position:absolute;
    top:55px;
    left:50%;

    transform:translateX(-50%);

    z-index:30;

    background:rgba(0,0,0,0.6);

    padding:10px;

    border-radius:10px;

    display:flex;
    flex-direction:column;

    gap:8px;

    color:white;
}

#controls label{
    font-size:14px;
}

#sampleId{

    width:180px;

    padding:6px;

    border:none;

    border-radius:5px;
}

/* Status */

#status{

    text-align:center;
    color:lime;
    font-weight:bold;
}

/* Grid */

#overlay{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    width:70vw;
    height:70vw;

    max-width:500px;
    max-height:500px;

    border:3px solid lime;

    display:grid;

    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);

    z-index:10;

    pointer-events:none;
}

.cell{

    border:1px solid rgba(0,255,0,0.7);
}

/* Crosshair */

#crosshair{

    position:absolute;

    width:40px;
    height:40px;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:20;
}

#crosshair:before{

    content:"";

    position:absolute;

    left:50%;

    width:2px;
    height:100%;

    background:red;
}

#crosshair:after{

    content:"";

    position:absolute;

    top:50%;

    width:100%;
    height:2px;

    background:red;
}

/* Capture Button */

#captureBtn{

    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    width:110px;
    height:110px;

    border:none;

    border-radius:50%;

    background:white;

    font-size:18px;
    font-weight:bold;

    z-index:30;
}

/* Canvas */

canvas{
    display:none;
}

</style>
</head>

<body>

<div id="title">
CrossCut Camera
</div>

<div id="controls">

<label>Sample ID</label>

<input
type="text"
id="sampleId"
placeholder="CC001">

<label>Grid Opacity</label>

<input
type="range"
id="opacitySlider"
min="10"
max="100"
value="70">

<div id="status">
Ready
</div>

</div>

<video
id="camera"
autoplay
playsinline>
</video>

<div id="crosshair"></div>

<div id="overlay"></div>

<button id="captureBtn">
Capture
</button>

<canvas id="canvas"></canvas>

document.getElementById("overlay");

for(let i=0;i<25;i++)
{
    const cell =
    document.createElement("div");

    cell.className =

    overlay.appendChild(cell);
}

document
.getElementById("opacitySlider")
.addEventListener("input",function(){

    overlay.style.opacity =
    this.value / 100;
});
