<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrossCut Camera</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* Camera */

#camera{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:1;
}

/* Title */

#title{

    position:fixed;

    top:10px;

    width:100%;

    text-align:center;

    color:white;

    font-size:22px;

    font-weight:bold;

    z-index:30;
}

/* Panel */

#panel{

    position:fixed;

    top:50px;

    left:10px;

    width:180px;

    z-index:30;

    background:rgba(0,0,0,0.6);

    color:white;

    padding:8px;

    border-radius:10px;

    font-size:12px;

    display:flex;

    flex-direction:column;

    gap:6px;
}

#sampleId,
#gridType{

    width:100%;
    padding:4px;
}

#status{

    color:lime;
    font-size:11px;
}

/* Grid */

#overlay{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:55vw;
    height:55vw;

    border:3px solid lime;

    display:grid;

    z-index:10;

    pointer-events:none;
}

.cell{

    border:1px solid rgba(0,255,0,0.7);
}

/* Crosshair */

#crosshair{

    position:fixed;

    top:50%;
    left:50%;

    width:40px;
    height:40px;

    transform:translate(-50%,-50%);

    z-index:20;
}

#crosshair:before{

    content:"";

    position:absolute;

    left:50%;

    width:2px;
    height:100%;

    background:red;
}

#crosshair:after{

    content:"";

    position:absolute;

    top:50%;

    width:100%;
    height:2px;

    background:red;
}

/* Capture Button */

#captureBtn{

    position:fixed;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);

    width:100px;
    height:100px;

    border:none;

    border-radius:50%;

    background:white;

    color:#007aff;

    font-size:20px;

    font-weight:bold;

    z-index:30;
}

/* Preview */

#previewContainer{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    display:none;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:999;
}

#previewImage{

    width:90%;
    max-height:70%;

    object-fit:contain;

    border:3px solid white;
}

#previewButtons{

    margin-top:20px;

    display:flex;

    gap:15px;
}

#previewButtons button{

    padding:12px 20px;

    border:none;

    border-radius:10px;

    font-size:16px;
}

#saveBtn{

    background:#00aa00;
    color:white;
}

#retakeBtn{

    background:#cc0000;
    color:white;
}

canvas{
    display:none;
}

</style>

</head>

<body>

<video id="camera"
       autoplay
       playsinline
       muted>
</video>

<div id="title">
CrossCut Camera
</div>

<div id="panel">

<label>Sample ID</label>

<input
type="text"
id="sampleId"
placeholder="CC001">

<label>Grid Type</label>

<select id="gridType">

<option value="5">
5 × 5
</option>

<option value="10">
10 × 10
</option>

</select>

<label>Grid Size</label>

<input
type="range"
id="sizeSlider"
min="35"
max="80"
value="55">

<label>Grid Opacity</label>

<input
type="range"
id="opacitySlider"
min="10"
max="100"
value="70">

<div id="status">
Starting...
</div>

</div>

<div id="crosshair"></div>

<div id="overlay"></div>

<button id="captureBtn">
Capture
</button>

<canvas id="canvas"></canvas>

<div id="previewContainer">

<img id="previewImage">

<div id="previewButtons">

<button id="saveBtn">
Save Photo
</button>

<button id="retakeBtn">
Retake
</button>

</div>

</div>

<script>

const overlay =
document.getElementById("overlay");

/* GRID */

function createGrid(n)
{
    overlay.innerHTML="";

    overlay.style.gridTemplateColumns =
    `repeat(${n},1fr)`;

    overlay.style.gridTemplateRows =
    `repeat(${n},1fr)`;

    for(let i=0;i<n*n;i++)
    {
        const cell =
        document.createElement("div");

        cell.className =
        "cell";

        overlay.appendChild(cell);
    }
}

createGrid(5);

/* GRID TYPE */

document
.getElementById("gridType")
.addEventListener("change",function(){

    createGrid(
        parseInt(this.value)
    );
});

/* GRID SIZE */

document
.getElementById("sizeSlider")
.addEventListener("input",function(){

    overlay.style.width =
    this.value + "vw";

    overlay.style.height =
    this.value + "vw";
});

/* GRID OPACITY */

document
.getElementById("opacitySlider")
.addEventListener("input",function(){

    overlay.style.opacity =
    this.value / 100;
});

/* CAMERA */

const video =
document.getElementById("camera");

async function startCamera()
{
    try
    {
        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false
        });

        video.srcObject =
        stream;

        await video.play();

        document
        .getElementById("status")
        .innerHTML =
        "Rear Camera Ready";
    }
    catch(error)
    {
        document
        .getElementById("status")
        .innerHTML =
        error.name;
    }
}

startCamera();

/* CAPTURE */

const previewContainer =
document.getElementById(
    "previewContainer"
);

const previewImage =
document.getElementById(
    "previewImage"
);

let capturedImageData =
null;

document
.getElementById("captureBtn")
.addEventListener("click",()=>{

    const canvas =
    document.getElementById("canvas");

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    capturedImageData =
    canvas.toDataURL(
        "image/png"
    );

    previewImage.src =
    capturedImageData;

    previewContainer.style.display =
    "flex";

});

/* SAVE */

document
.getElementById("saveBtn")
.addEventListener("click",()=>{

    const sampleId =

    document
    .getElementById("sampleId")
    .value.trim()

    ||

    "Sample";

    const filename =

    sampleId +

    "_" +

    Date.now()

    +

    ".png";

    const link =
    document.createElement("a");

    link.href =
    capturedImageData;

    link.download =
    filename;

    link.click();
});

/* RETAKE */

document
.getElementById("retakeBtn")
.addEventListener("click",()=>{

    previewContainer.style.display =
    "none";
});

</script>

</body>

</html>
