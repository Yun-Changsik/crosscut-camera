<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrossCut Camera</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#camera{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:1;
}

#title{
    position:fixed;
    top:8px;
    width:100%;
    text-align:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    z-index:50;
}

#panel{
    position:fixed;
    top:40px;
    left:10px;

    width:170px;

    background:rgba(0,0,0,0.65);

    color:white;

    padding:8px;

    border-radius:10px;

    font-size:11px;

    display:flex;
    flex-direction:column;
    gap:6px;

    z-index:50;
}

#panel input,
#panel select{
    width:100%;
}

#status{
    text-align:center;
    color:lime;
    font-size:11px;
}

#overlay{
    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:30vw;
    height:30vw;

    border:3px solid lime;

    display:grid;

    z-index:10;

    pointer-events:none;
}

.cell{
    border:1px solid rgba(0,255,0,0.7);
}

#crosshair{

    position:fixed;

    top:50%;
    left:50%;

    width:40px;
    height:40px;

    transform:translate(-50%,-50%);

    z-index:30;
}

#crosshair:before{
    content:"";

    position:absolute;

    left:50%;

    width:2px;
    height:100%;

    background:red;
}

#crosshair:after{
    content:"";

    position:absolute;

    top:50%;

    width:100%;
    height:2px;

    background:red;
}

#captureBtn{

    position:fixed;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    width:90px;
    height:90px;

    border:none;

    border-radius:50%;

    background:white;

    color:#007aff;

    font-size:18px;

    font-weight:bold;

    z-index:50;
}

canvas{
    display:none;
}

#previewContainer{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.95);

    display:none;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:999;
}

#previewImage{

    width:90%;

    max-height:70%;

    object-fit:contain;

    border:2px solid white;
}

#previewButtons{

    display:flex;

    gap:20px;

    margin-top:20px;
}

#previewButtons button{

    border:none;

    border-radius:10px;

    padding:12px 20px;

    font-size:16px;
}

#saveBtn{
    background:#0aa000;
    color:white;
}

#retakeBtn{
    background:#cc0000;
    color:white;
}

</style>
</head>

<body>

<video
id="camera"
autoplay
playsinline
muted>
</video>

<div id="title">
CrossCut Camera
</div>

<div id="panel">

<label>Sample ID</label>

<input
type="text"
id="sampleId"
placeholder="CC001">

<label>
<input
type="checkbox"
id="autoIncrement"
checked>
Auto Increment
</label>

<label>Grid Type</label>

<select id="gridType">
<option value="5">5 x 5</option>
<option value="10">10 x 10</option>
</select>

<label>Grid Size</label>

<input
type="range"
id="sizeSlider"
min="10"
max="80"
value="30">

<label>Grid Opacity</label>

<input
type="range"
id="opacitySlider"
min="10"
max="100"
value="70">

<div id="status">
Starting...
</div>

</div>

<div id="crosshair"></div>

<div id="overlay"></div>

<button id="captureBtn">
Capture
</button>

<canvas id="canvas"></canvas>

<div id="previewContainer">

<img id="previewImage">

<div id="previewButtons">

<button id="saveBtn">
Save Photo
</button>

<button id="retakeBtn">
Retake
</button>

</div>

</div>

<script>

/* GRID */

const overlay =
document.getElementById("overlay");

function createGrid(n)
{
    overlay.innerHTML = "";

    overlay.style.gridTemplateColumns =
    `repeat(${n},1fr)`;

    overlay.style.gridTemplateRows =
    `repeat(${n},1fr)`;

    for(let i=0;i<n*n;i++)
    {
        const cell =
        document.createElement("div");

        cell.className = "cell";

        overlay.appendChild(cell);
    }
}

/* SAVED SETTINGS */

const savedGrid =
localStorage.getItem("gridType");

const savedSize =
localStorage.getItem("gridSize");

const savedSample =
localStorage.getItem("sampleId");

if(savedSample)
{
    document.getElementById("sampleId").value =
    savedSample;
}

if(savedGrid)
{
    document.getElementById("gridType").value =
    savedGrid;

    createGrid(parseInt(savedGrid));
}
else
{
    createGrid(5);
}

if(savedSize)
{
    document.getElementById("sizeSlider").value =
    savedSize;

    overlay.style.width =
    savedSize + "vw";

    overlay.style.height =
    savedSize + "vw";
}

/* SAMPLE */

document
.getElementById("sampleId")
.addEventListener("input",function(){

    localStorage.setItem(
        "sampleId",
        this.value
    );
});

/* GRID TYPE */

document
.getElementById("gridType")
.addEventListener("change",function(){

    createGrid(
        parseInt(this.value)
    );

    localStorage.setItem(
        "gridType",
        this.value
    );
});

/* GRID SIZE */

document
.getElementById("sizeSlider")
.addEventListener("input",function(){

    overlay.style.width =
    this.value + "vw";

    overlay.style.height =
    this.value + "vw";

    localStorage.setItem(
        "gridSize",
        this.value
    );
});

/* OPACITY */

document
.getElementById("opacitySlider")
.addEventListener("input",function(){

    overlay.style.opacity =
    this.value / 100;
});

/* CAMERA */

const video =
document.getElementById("camera");

async function startCamera()
{
    try{
        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false
        });

        video.srcObject = stream;

        await video.play();

        document
        .getElementById("status")
        .innerHTML =
        "Rear Camera Ready";

    }catch(error){

        document
        .getElementById("status")
        .innerHTML =
        error.name;
    }
}

startCamera();

/* CAPTURE */

const previewContainer =
document.getElementById(
"previewContainer"
);

const previewImage =
document.getElementById(
"previewImage"
);

let capturedImageData =
null;

document
.getElementById("captureBtn")
.addEventListener("click",()=>{

    const canvas =
    document.getElementById("canvas");

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    capturedImageData =
    canvas.toDataURL("image/png");

    previewImage.src =
    capturedImageData;

    previewContainer.style.display =
    "flex";
});

/* SAVE */

document
.getElementById("saveBtn")
.addEventListener("click",()=>{

    const sampleId =
    document
    .getElementById("sampleId")
    .value.trim()

    || "Sample";

    const filename =
    sampleId +
    "_" +
    Date.now() +
    ".png";

    const link =
    document.createElement("a");

    link.href =
    capturedImageData;

    link.download =
    filename;

    link.click();

    document
    .getElementById("status")
    .innerHTML =
    filename;

    if(
    document
    .getElementById("autoIncrement")
    .checked
    )
    {
        const match =
        sampleId.match(
        /(.*?)(\d+)$/
        );

        if(match)
        {
            const prefix =
            match[1];

            const next =
            String(
                parseInt(match[2])+1
            ).padStart(
                match[2].length,
                "0"
            );

            const nextId =
            prefix + next;

            document
            .getElementById("sampleId")
            .value =
            nextId;

            localStorage.setItem(
                "sampleId",
                nextId
            );
        }
    }
});

/* RETAKE */

document
.getElementById("retakeBtn")
.addEventListener("click",()=>{

    previewContainer.style.display =
    "none";
});

</script>

</body>
</html>
