<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrossCut Camera</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<video
id="camera"
autoplay
playsinline
muted>
</video>

<div id="title">
CrossCut Camera
</div>

<div id="panel">

<label>Sample ID</label>

<input
type="text"
id="sampleId"
placeholder="CC001">

<label>
<input
type="checkbox"
id="autoIncrement"
checked>
Auto Increment
</label>

<label>Grid Type</label>

<select id="gridType">

<option value="5">
5 × 5
</option>

<option value="10">
10 × 10
</option>

</select>

<label>Grid Size</label>

<input
type="range"
id="sizeSlider"
min="10"
max="80"
value="30">

<label>Grid Opacity</label>

<input
type="range"
id="opacitySlider"
min="10"
max="100"
value="70">

<div id="status">
Starting...
</div>

</div>

<div id="crosshair"></div>

<div id="overlay"></div>

<button id="captureBtn">
Capture
</button>

<canvas id="canvas"></canvas>

<div id="previewContainer">

<img id="previewImage">

<div id="previewButtons">

<button id="saveBtn">
Save Photo
</button>

<button id="retakeBtn">
Retake
</button>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
